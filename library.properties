sentence=Receiver library: let another ESP32 (S3 sender) program this ESP32 over WiFi with ONE line of code.
paragraph=Add WiFiProgrammer.begin() to setup() and your ESP32 can be re-programmed wirelessly. Works in the background, so your loop() and delay() are not affected. Includes optional callbacks and status LED.
